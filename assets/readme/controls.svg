<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="ctitle cdesc">
  <title id="ctitle">Interactive controls / 交互控件</title>
  <desc id="cdesc">Three controls: language ZH/EN, market China/Global, and period — year to date, quarter through 2026Q3, and half-year.</desc>
  <rect width="1200" height="260" rx="22" fill="#0B1422"/>
  <text x="40" y="42" fill="#8BA4C0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">FEATURE 01  |  INTERACTIVE CONTROLS  |  三项交互控件</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(40 70)">
      <rect width="360" height="150" rx="16" fill="#122033" stroke="#2A4566"/>
      <rect x="20" y="22" width="44" height="22" rx="6" fill="#2563EB"/>
      <text x="32" y="38" fill="#FFFFFF" font-size="12" font-weight="700">A</text>
      <text x="20" y="74" fill="#F2F6FB" font-size="22" font-weight="700">Language</text>
      <text x="20" y="100" fill="#93C5FD" font-size="16">语言切换</text>
      <text x="20" y="130" fill="#A9C0D8" font-size="14">中文 / English — headings, tables,</text>
      <text x="20" y="150" fill="#A9C0D8" font-size="14">and chart captions switch together.</text>
    </g>

    <g transform="translate(420 70)">
      <rect width="360" height="150" rx="16" fill="#122033" stroke="#2A4566"/>
      <rect x="20" y="22" width="44" height="22" rx="6" fill="#EA580C"/>
      <text x="32" y="38" fill="#FFFFFF" font-size="12" font-weight="700">B</text>
      <text x="20" y="74" fill="#F2F6FB" font-size="22" font-weight="700">Market lens</text>
      <text x="20" y="100" fill="#FDBA74" font-size="16">市场视角</text>
      <text x="20" y="130" fill="#A9C0D8" font-size="14">China and Global stay in one dataset —</text>
      <text x="20" y="150" fill="#A9C0D8" font-size="14">never analysed in isolation.</text>
    </g>

    <g transform="translate(800 70)">
      <rect width="360" height="150" rx="16" fill="#122033" stroke="#2A4566"/>
      <rect x="20" y="22" width="44" height="22" rx="6" fill="#0F766E"/>
      <text x="32" y="38" fill="#FFFFFF" font-size="12" font-weight="700">C</text>
      <text x="20" y="74" fill="#F2F6FB" font-size="22" font-weight="700">Period</text>
      <text x="20" y="100" fill="#5EEAD4" font-size="16">时间</text>
      <text x="20" y="130" fill="#A9C0D8" font-size="14">Year to date is Jan–Sep 2026.</text>
      <text x="20" y="150" fill="#A9C0D8" font-size="14">Quarter and half-year are other cuts.</text>
    </g>
  </g>
</svg>
