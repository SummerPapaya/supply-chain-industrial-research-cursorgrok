  <text x="40" y="68" fill="#B7C9DD" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Same skeleton every edition — comparable across periods / 每期同一骨架，跨期可对照</text>

