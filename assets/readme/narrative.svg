<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="ntitle ndesc">
  <title id="ntitle">Report narrative flow / 报告叙事结构</title>
  <desc id="ndesc">Six plates in the interactive report: readings, judgment, monthly path, moves, capability structure, and sources.</desc>
