<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">China and Global dual lens / 中国与全球双视角</title>
  <desc id="ddesc">China solid blue, Global dashed amber, five capability dimensions.</desc>
  <rect width="1200" height="170" rx="22" fill="#0B1422"/>
  <text x="40" y="38" fill="#8BA4C0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">FEATURE 04  |  DUAL LENS  |  双视角雷达</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(40 66)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#2563EB" stroke-width="3"/>
      <text x="28" y="16" fill="#F2F6FB" font-size="20" font-weight="700">China 中国</text>
      <text x="28" y="42" fill="#A9C0D8" font-size="14">solid blue / 蓝色实线</text>
    </g>
    <g transform="translate(300 66)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#EA580C" stroke-width="3" stroke-dasharray="4 3"/>
      <text x="28" y="16" fill="#F2F6FB" font-size="20" font-weight="700">Global 全球</text>
      <text x="28" y="42" fill="#A9C0D8" font-size="14">dashed amber / 橙色虚线</text>
    </g>
    <g transform="translate(600 60)" font-size="14" fill="#B7C9DD">
      <text x="0" y="18">Forecasting | Critical parts | Warehouse sync</text>
      <text x="0" y="42">预测补货 | 关键件保障 | 仓配协同</text>
      <text x="0" y="66">Cross-border fulfilment | Reverse logistics</text>
      <text x="0" y="90">跨境履约 | 逆向物流</text>
    </g>
  </g>
</svg>
